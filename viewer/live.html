<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sam · Conversation</title>
<style>
:root{
  --bg:#faf8f2; --card:#fff; --line:#e2ded4; --ink:#26221a; --muted:#8a8271;
  --accent:#7a5af5; --good:#2e7d32; --bad:#b3402a; --chip:#f0ece2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:400px 1fr;height:100vh;overflow:hidden}
h1{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:12px}

/* ---------- left: chat ---------- */
#chat{display:flex;flex-direction:column;border-right:1px solid var(--line);
  background:#f5f1e8;height:100vh}
#chat header{padding:14px 16px;border-bottom:1px solid var(--line)}
#situation,#modelInfo{font-size:12px;color:var(--muted);margin-top:4px}
#bar{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line)}
#bar select{flex:1;min-width:0;font-size:12px;padding:4px;border:1px solid var(--line);
  border-radius:4px;background:#fff}
#bar button{font-size:12px;padding:4px 10px;border:1px solid var(--line);
  border-radius:4px;background:#fff;cursor:pointer;white-space:nowrap}
#transcript{flex:1;overflow-y:auto;padding:14px 16px;display:flex;
  flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;white-space:pre-wrap}
.msg.us{align-self:flex-end;background:#e7e0f8;border:1px solid #d4c8f0;
  border-bottom-right-radius:3px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);
  border-bottom-left-radius:3px}
.msg .who{font-size:10px;color:var(--muted);margin-bottom:2px;
  text-transform:uppercase;letter-spacing:.06em}
.msg[role="button"]{cursor:pointer}
.msg[aria-pressed="true"]{outline:2px solid #b7a8df;outline-offset:2px}
.msg[role="button"]:focus-visible{outline:2px solid var(--accent)}
#composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
#composer textarea{flex:1;resize:none;height:60px;padding:8px;font:inherit;
  border:1px solid var(--line);border-radius:8px;background:#fff}
#composer button{padding:0 18px;border:none;border-radius:8px;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:600}
#composer button:disabled{background:#c5bcae;cursor:default}
#status{padding:4px 16px 10px;font-size:11px;color:var(--muted);min-height:18px}

/* ---------- right: pipeline ---------- */
#pipe{overflow-y:auto;height:100vh;padding:18px 26px 80px}
.stage{margin-bottom:28px;animation:fadeup .55s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
.stage>h2{font-size:13px;margin:0;letter-spacing:.05em;text-transform:uppercase}
.stage>.sub{margin:2px 0 12px;max-width:780px}
.turnhdr{font-size:12px;color:var(--muted);border-top:2px solid var(--line);
  padding-top:10px;margin:10px 0 18px}
.waiting{font-size:12px;color:var(--muted);font-style:italic}

/* machine bubbles */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;overflow:hidden;animation:pop .35s ease;
  transition:padding .4s ease,background .4s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.bubble h3{margin:0;font-size:13px;display:flex;gap:6px;align-items:center}
.bubble .collapse{margin-left:auto;border:0;background:none;color:var(--muted);
  font:inherit;font-size:10px;cursor:pointer}
.phase-label{color:var(--muted);font-size:11px;margin:8px 0 3px}
.chip{font-size:10px;background:var(--chip);border-radius:8px;padding:1px 7px;
  color:var(--muted)}
.bubble .sens{font-size:11px;color:var(--muted);margin:3px 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stream{white-space:pre-wrap;font-size:12px;max-height:220px;overflow-y:auto}
.typing .stream:not(:empty)::after{content:"▋";animation:blink 1s steps(1) infinite;
  color:var(--accent)}
@keyframes blink{50%{opacity:0}}
details.compact{font-size:12px;margin:4px 0}
details.compact>summary{cursor:pointer;color:var(--muted);font-size:11px;
  user-select:none}
.bubble.shrunk .stream,.bubble.shrunk details,.bubble.shrunk .sens,
.bubble.shrunk .phase-label{display:none}
.bubble.shrunk{padding:6px 10px;background:#fbfaf6}
.bubble.shrunk h3{font-size:12px}
.bubble .conclusion{font-size:11px;color:var(--muted);display:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble.shrunk .conclusion{display:block}

/* selection list */
.sellist{display:flex;flex-direction:column;gap:3px}
.selrow{font-size:12px;color:var(--muted)}
.selrow b{color:var(--ink);font-weight:600}

/* groups: bordered boxes, arrow straight down into the synthesizer */
.grouprow{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.groupcol{flex:1;min-width:320px;display:flex;flex-direction:column}
.groupbox{border:2px solid #cfc6b4;border-radius:12px;padding:10px;
  display:flex;flex-direction:column;gap:8px;background:#fdfcf8}
.groupbox .glabel{font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}
.arrow{align-self:center;width:2px;height:26px;background:#cfc6b4;position:relative}
.arrow::after{content:"";position:absolute;bottom:-1px;left:-4px;
  border:5px solid transparent;border-top-color:#cfc6b4}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;animation:pop .35s ease}
.card h3{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center;
  flex-wrap:wrap}
.badge{font-size:10px;border-radius:8px;padding:1px 8px;background:#e7e0f8;
  color:#5a3fd6;text-transform:uppercase;letter-spacing:.05em}
.panel{border-left:3px solid var(--line);padding:4px 10px;margin:8px 0;
  font-size:12px;white-space:pre-wrap}
.panel.surface{border-left-color:#c99}
.panel.reply{border-left-color:#9c9}
.verdict{font-weight:700;font-size:12px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.finalreply{font-size:16px;background:#eef7ee;border:1px solid #cfe6cf;
  border-radius:12px;padding:16px 20px;max-width:720px;white-space:pre-wrap;
  animation:pop .4s ease}
.err{background:#fbe9e5;border:1px solid #eac4bb;color:var(--bad);
  border-radius:8px;padding:10px 14px;margin:10px 0;font-size:12px}
.note{font-size:11px;color:var(--muted)}
.turn-view.done-dim .stage:not(:last-child){opacity:.78}
</style>
</head>
<body>
<div id="chat">
  <header>
    <h1 id="pname">Sam</h1>
    <div id="modelInfo"></div>
  </header>
  <div id="bar">
    <button id="newBtn">New chat</button>
    <select id="traceSel"><option>loading…</option></select>
    <button id="replayBtn">Replay</button>
    <button id="exportBtn" title="Save this conversation for the replay website">Export conversation</button>
  </div>
  <div id="transcript"></div>
  <div id="status"></div>
  <div id="composer">
    <textarea id="input" placeholder="Message Sam"></textarea>
    <button id="send">Send</button>
  </div>
</div>
<div id="pipe"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const pipe = $("#pipe");
let personaName = "Sam";

/* Short display descriptions. Model instructions stay in the persona files. */
const STAGES = {
  selection:["Selection", "Choose relevant machines."],
  machines:["Machines", "Analyze the message in parallel."],
  synthesis:["Synthesis", "Combine each group's outputs."],
  editor:["Interior update", "Update state and draft a reply."],
  armor:["Refinement & fit", "Revise the reply and check its fit."],
};
const MACHINE_DESCRIPTIONS = {
  Compensator: "Balances one-sided reactions.",
  Situation: "Checks what suits the relationship.",
  Pulsation: "Sets the pace and reply length.",
  Laetitia: "Responds to new possibilities.",
  Cupiditas: "Follows what Sam wants.",
  Tristitia: "Responds to loss and disappointment.",
  Hope: "Anticipates a good outcome.",
  Glory: "Responds to praise and recognition.",
  Fear: "Anticipates rejection or distance.",
  Shame: "Responds to feeling exposed.",
  Longing: "Reaches toward someone or something absent.",
  Implication: "Notices what the words imply.",
  Memento: "Responds to endings and mortality.",
  Hesitation: "Notices pauses, evasions, and rehearsed answers.",
  "Register-shift": "Tracks changes in tone and closeness.",
  "Memory-generator": "Brings a memory into the moment.",
  Fantasy: "Imagines a wanted or feared scene.",
  Inflate: "Covers uncertainty with extra confidence.",
  Appease: "Smooths friction to stay liked.",
  Withhold: "Pulls back under pressure.",
};
let buffers = {}, machineEls = {}, groupEls = [], stageEls = {}, busy = false;
let armorRounds = {}, shown = {}, doneQ = {};
let turnPanels = new Map(), turnPanel = null, currentTurn = -1, selectedTurn = -1, followLatest = true;
let eventQueue = [], holdMs = 0;
const idleWaiters = new Set();
const txt = id => (buffers[id] || "").slice(0, shown[id] || 0);

/* Network/replay clocks can run ahead. Boundaries wait for the display,
   while calls within a stage keep streaming in parallel. */
function hasUnpaintedText(){
  return Object.keys(doneQ).length > 0 || Object.entries(buffers).some(
    ([id, text]) => (shown[id] || 0) < text.length);
}
function needsCompletedText(ev){
  return ["stage_started", "groups_assigned", "fit_round", "turn_done", "turn_started"].includes(ev.type)
    || (ev.type === "call_started" && /^final\/(armor|fit-check|redraft)/.test(ev.id));
}
function playbackIdle(){ return !eventQueue.length && !holdMs && !hasUnpaintedText(); }
function settleIdle(){
  if (playbackIdle()) for (const done of [...idleWaiters]) done();
}
function processEvents(){
  if (globalThis.personaReplayView?.paused) return;
  while (eventQueue.length && !holdMs){
    const ev = eventQueue[0];
    if (needsCompletedText(ev) && hasUnpaintedText()) break;
    eventQueue.shift();
    (handlers[ev.type] || (() => {}))(ev);
    if (ev.type === "groups_assigned") holdMs = 650;
    if (ev.type === "turn_done") holdMs = 900;
  }
  settleIdle();
}
function receiveEvent(ev){
  if (ev.type === "session_reset") clearAll();
  eventQueue.push(ev);
  processEvents();
}
setInterval(() => {
  if (globalThis.personaReplayView?.paused) return;
  holdMs = Math.max(0, holdMs - 33);
  let moved = false;
  for (const id in buffers){
    const full = buffers[id], s = shown[id] || 0;
    if (s < full.length){
      moved = true;
      // 900 characters/second per call, without the old slow trailing tail.
      shown[id] = Math.min(full.length, s + 30);
      route(id);
    }
    if ((shown[id] || 0) >= full.length && doneQ[id]){
      const callbacks = doneQ[id]; delete doneQ[id];
      callbacks.forEach(fn => fn());
    }
  }
  if (moved) followPipe();
  processEvents();
}, 33);
function scheduleDone(id, fn){
  if ((shown[id] || 0) >= (buffers[id] || "").length) fn();
  else (doneQ[id] ||= []).push(fn);
}
function whenIdle(signal){
  return new Promise((resolve, reject) => {
    const cleanup = () => { idleWaiters.delete(done); signal?.removeEventListener("abort", cancel); };
    const done = () => { cleanup(); resolve(); };
    const cancel = () => { cleanup(); reject(new DOMException("Stopped", "AbortError")); };
    if (signal?.aborted) { cancel(); return; }
    if (playbackIdle()) { resolve(); return; }
    idleWaiters.add(done);
    signal?.addEventListener("abort", cancel, {once:true});
  });
}

/* Follow the pipeline only while the user is near the bottom. */
let follow = true;
pipe.addEventListener("scroll", () => {
  follow = pipe.scrollHeight - pipe.scrollTop - pipe.clientHeight < 220;
});
function followPipe(){ if (follow && selectedTurn === currentTurn) pipe.scrollTop = pipe.scrollHeight; }

function el(tag, cls, parent, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function setStatus(t){ $("#status").textContent = t; }
function setBusy(b){ busy = b; $("#send").disabled = b;
  $("#replayBtn").disabled = b; $("#newBtn").disabled = b;
  $("#exportBtn").disabled = b;
  globalThis.personaReplayView?.onBusyChange?.(); }
function showTurn(index){
  if (!turnPanels.has(index)) return false;
  selectedTurn = index; followLatest = index === currentTurn;
  for (const [number, panel] of turnPanels) panel.hidden = number !== index;
  for (const message of $("#transcript").querySelectorAll("[data-turn]"))
    message.setAttribute("aria-pressed", String(Number(message.dataset.turn) === index));
  pipe.scrollTop = 0;
  globalThis.personaReplayView?.onTurnSelected?.(index);
  return true;
}
function addMsg(who, text, index = currentTurn){
  const mine = who === "you";
  const m = el("div", "msg " + (mine ? "us" : "them"), $("#transcript"));
  el("div", "who", m, mine ? "you" : personaName);
  el("div", "", m, text);
  m.dataset.turn = String(index);
  m.setAttribute("role", "button"); m.tabIndex = 0;
  m.setAttribute("aria-label", "View turn " + (index + 1));
  m.setAttribute("aria-pressed", String(index === selectedTurn));
  m.onclick = () => {
    if (!showTurn(index)) globalThis.personaReplayView?.onTurnRequest?.(index);
  };
  m.onkeydown = event => {
    if (event.key === "Enter" || event.key === " "){ event.preventDefault(); m.click(); }
  };
  $("#transcript").scrollTop = 1e9;
}
function clearAll(){
  $("#transcript").innerHTML = "";
  pipe.innerHTML = "";
  buffers = {}; machineEls = {}; groupEls = []; stageEls = {}; armorRounds = {};
  shown = {}; doneQ = {}; eventQueue = []; holdMs = 0;
  turnPanels = new Map(); turnPanel = null; currentTurn = -1; selectedTurn = -1; followLatest = true;
  document.body.classList.remove("done-dim");
  setStatus("");
  settleIdle();
}
function stageSection(name){
  if (stageEls[name]) return stageEls[name];
  const s = el("section", "stage", turnPanel);
  const [title, sub] = STAGES[name] || [name, ""];
  el("h2", "", s, title);
  el("div", "sub", s, sub);
  stageEls[name] = s;
  followPipe();
  return s;
}
function jsonField(buf, key){
  const m = new RegExp('"' + key + '"\\s*:\\s*"').exec(buf);
  if (!m) return null;
  let i = m.index + m[0].length, out = "";
  while (i < buf.length){
    const c = buf[i];
    if (c === "\\"){
      const n = buf[i + 1];
      if (n === undefined) break;
      if (n === "n") out += "\n";
      else if (n === "t") out += "\t";
      else if (n === "u"){ const h = buf.slice(i + 2, i + 6);
        if (h.length === 4){ out += String.fromCharCode(parseInt(h, 16)); i += 4; } }
      else out += n;
      i += 2; continue;
    }
    if (c === '"') break;
    out += c; i++;
  }
  return out;
}
const PRODUCT_RE = /(?:^|\n)\s*#{0,3}\s*\**PRODUCT\**\s*:?\s*(?:\n|$)/i;

function machinesStage(){
  const s = stageSection("machines");
  if (!s.querySelector(".mgrid")) el("div", "mgrid", s);
  return s;
}
function machineBubble(m){
  machinesStage();
  const b = el("div", "bubble typing", machinesStage().querySelector(".mgrid"));
  b.dataset.name = m.name;
  const h = el("h3", "", b, m.name + " ");
  el("span", "chip", h, m.category);
  const collapse = el("button", "collapse", h, "Collapse");
  collapse.setAttribute("aria-expanded", "true");
  collapse.onclick = () => {
    const collapsed = b.classList.toggle("shrunk");
    collapse.textContent = collapsed ? "Expand" : "Collapse";
    collapse.setAttribute("aria-expanded", String(!collapsed));
  };
  el("div", "sens", b, MACHINE_DESCRIPTIONS[m.name] || "Adds a response from this perspective.");
  const d = el("details", "compact", b);
  el("summary", "", d, "Analysis");
  d.open = true;
  el("div", "stream ana", d);
  el("div", "phase-label", b, "Product");
  el("div", "stream prod", b);
  el("div", "conclusion", b);
  machineEls[m.name] = b;
  return b;
}
function renderMachine(name){
  const b = machineEls[name]; if (!b) return;
  const buf = txt("machine/" + name);
  const m = PRODUCT_RE.exec(buf);
  const ana = b.querySelector(".ana"), prod = b.querySelector(".prod");
  if (m){
    ana.textContent = buf.slice(0, m.index);
    prod.textContent = buf.slice(m.index + m[0].length);
  } else {
    ana.textContent = buf;
  }
  (m ? prod : ana).scrollTop = 1e9;
}

function resetTurn(inputText, replay, index = currentTurn + 1){
  buffers = {}; machineEls = {}; groupEls = []; stageEls = {};
  armorRounds = {}; shown = {}; doneQ = {};
  currentTurn = index;
  turnPanel = el("div", "turn-view", pipe);
  turnPanel.dataset.turn = String(index);
  el("div", "turnhdr", turnPanel, "Turn " + (index + 1));
  turnPanels.get(index)?.remove();
  turnPanels.set(index, turnPanel);
  turnPanel.hidden = true;
  if (followLatest) showTurn(index);
  follow = true;
  document.body.classList.remove("done-dim");
  addMsg("you", inputText);
  setBusy(true);
  setStatus(replay ? "Replaying…" : "Writing a reply…");
}

const handlers = {
  session_reset: () => { clearAll(); setBusy(false); loadTraces(); },
  turn_started: ev => resetTurn(ev.input, ev.replay, ev.index),
  stage_started: ev => {
    if (STAGES[ev.stage]) stageSection(ev.stage);
    if (ev.stage === "selection"){
      const s = stageSection("selection");
      if (!s.querySelector(".waiting"))
        el("div", "waiting", s, "reading the moment…");
    }
  },
  selection_done: ev => {
    const s = stageSection("selection");
    const w = s.querySelector(".waiting"); if (w) w.remove();
    const list = el("div", "sellist", s);
    ev.fired.forEach(m => {
      const r = el("div", "selrow", list);
      el("b", "", r, m.name);
      el("span", "", r, ": " + (m.resonance || ""));
    });
    machinesStage();
    ev.fired.forEach(machineBubble);
  },
  call_started: ev => {
    if (ev.id.startsWith("final/armor"))
      armorRound(roundOfArmor(ev.id)).cand.classList.add("typing");
  },
  call_delta: ev => {
    buffers[ev.id] = (buffers[ev.id] || "") + ev.text;
  },
  call_done: ev => {
    // Some transports provide a completed output without token deltas.
    if (!buffers[ev.id] && ev.output != null)
      buffers[ev.id] = typeof ev.output === "string" ? ev.output : JSON.stringify(ev.output);
    scheduleDone(ev.id, () => {
      if (ev.id.startsWith("machine/")){
        const name = ev.id.slice(8), b = machineEls[name];
        if (b){
          b.classList.remove("typing");
          const buf = buffers[ev.id] || "", m = PRODUCT_RE.exec(buf);
          const prod = m ? buf.slice(m.index + m[0].length) : buf;
          b.querySelector(".conclusion").textContent =
            prod.split("\n").find(l => l.trim()) || "";
        }
      }
      if (ev.id.startsWith("final/armor"))
        armorRound(roundOfArmor(ev.id)).cand.classList.remove("typing");
    });
  },
  groups_assigned: ev => {
    // FLIP: capture where every bubble is, move them into their group
    // boxes, then animate from the old position to the new one.
    const before = new Map(
      Object.entries(machineEls).map(([n, b]) => [n, b.getBoundingClientRect()]));
    // Regroup inside the machines stage. Its header stays; the synthesis
    // stage gets one aligned column per group, arrow at the top.
    const ms = machinesStage();
    const grid = ms.querySelector(".mgrid"); if (grid) grid.remove();
    const grow = el("div", "grouprow", ms);
    const s = stageSection("synthesis");
    const srow = el("div", "grouprow", s);
    ev.groups.forEach((members, i) => {
      const gcol = el("div", "groupcol", grow);
      const box = el("div", "groupbox", gcol);
      el("div", "glabel", box, "group " + (i + 1));
      members.forEach(n => {
        const b = machineEls[n];
        if (b) box.appendChild(b);
      });
      const scol = el("div", "groupcol", srow);
      el("div", "arrow", scol);
      const c = el("div", "card synth", scol);
      const h = el("h3", "", c, "Group " + (i + 1) + " ");
      el("span", "badge mode", h, "…");
      const d = el("details", "compact", c);
      el("summary", "", d, "Analysis"); d.open = true;
      el("div", "stream think", d);
      el("div", "phase-label", c, "Result");
      el("div", "stream result", c);
      groupEls.push({members, card: c});
    });
    requestAnimationFrame(() => {
      for (const [n, b] of Object.entries(machineEls)){
        const r0 = before.get(n); if (!r0) continue;
        const r1 = b.getBoundingClientRect();
        b.style.transition = "none";
        b.style.transform =
          `translate(${r0.left - r1.left}px,${r0.top - r1.top}px)`;
        requestAnimationFrame(() => {
          b.style.transition = "transform .65s ease";
          b.style.transform = "";
        });
      }
      followPipe();
    });
  },
  synthesis_done: ev => {
    const g = groupEls[ev.group - 1]; if (!g) return;
    const id = "synthesis/" + ev.members.join(" + ");
    scheduleDone(id, () => {
      g.card.querySelector(".mode").textContent = ev.mode;
      g.card.querySelector(".think").textContent = ev.thinking;
      g.card.querySelector(".result").textContent = ev.result;
    });
  },
  editor_done: ev => {
    const card = stageSection("editor").querySelector(".card.editor") || editorCard();
    scheduleDone("final/interior-editor", () => {
      card.querySelector(".surface").textContent = ev.bwo;
      card.querySelector(".reply").textContent = ev.response;
      card.querySelector(".just").textContent = ev.justification || "(none)";
      const ed = card.querySelector(".editlist");
      ed.innerHTML = "";
      (ev.edits || []).forEach(e => {
        const note = el("div", "note", ed);
        el("div", "", note, "• " + (e.change || "") + "  [" + (e.driven_by || []).join(", ") + "]");
        if (e.why) el("div", "edit-reason", note, e.why);
      });
    });
  },
  fit_round: ev => {
    const r = armorRound(ev.round);
    fitDetails(r).textContent = ev.explanation;
    const v = el("div", "", r.box);
    el("span", "verdict " + (ev.fits ? "ok" : "no"), v,
      ev.fits ? "✓ fits the conversation" : "✗ does not fit");
  },
  turn_done: ev => {
    const s = el("section", "stage", turnPanel);
    el("h2", "", s, "The reply");
    el("div", "sub", s, "Final response.");
    el("div", "finalreply", s, ev.response);
    addMsg("persona", ev.response);
    turnPanel.classList.add("done-dim");
    setBusy(false); setStatus("");
    followPipe();
  },
  turn_error: ev => {
    el("div", "err", turnPanel || pipe, "Turn failed: " + ev.error);
    setBusy(false); setStatus("Error. See the right pane.");
  },
  trace_saved: () => loadTraces(),
};

function editorCard(){
  const s = stageSection("editor");
  const card = el("div", "card editor", s);
  el("h3", "", card, "interior editor");
  const det = el("details", "compact th", card);
  el("summary", "", det, "Analysis");
  det.open = true;
  el("div", "stream think", det);
  el("div", "note", card, "inner state (BwO), after this moment:");
  el("div", "panel surface", card);
  el("div", "note", card, "draft reply:");
  el("div", "panel reply", card);
  const jd = el("details", "compact", card);
  el("summary", "", jd, "Why this reply");
  el("div", "stream just", jd);
  const edd = el("details", "compact", card);
  el("summary", "", edd, "State changes");
  el("div", "editlist", edd);
  return card;
}
function roundOfArmor(id){
  const m = /armor-?(\d*)$/.exec(id); return m && m[1] ? +m[1] : 1;
}
function armorRound(n){
  if (armorRounds[n]) return armorRounds[n];
  const s = stageSection("armor");
  const box = el("div", "card", s);
  el("h3", "", box, "attempt " + n);
  el("div", "phase-label", box, "Reply");
  const cand = el("div", "panel reply stream", box);
  armorRounds[n] = {box, cand, review: null};
  return armorRounds[n];
}
function fitDetails(round){
  if (!round.review){
    const details = el("details", "compact", round.box);
    el("summary", "", details, "Fit review"); details.open = true;
    round.review = el("div", "stream review", details);
  }
  return round.review;
}
function route(id){
  const buf = txt(id);
  if (id.startsWith("machine/")) return renderMachine(id.slice(8));
  if (id.startsWith("synthesis/")){
    const label = id.slice(10);
    const g = groupEls.find(x => x.members.join(" + ") === label);
    if (!g) return;
    const th = jsonField(buf, "thinking"), rs = jsonField(buf, "result");
    if (th !== null) g.card.querySelector(".think").textContent = th;
    if (rs !== null) g.card.querySelector(".result").textContent = rs;
    return;
  }
  if (id === "final/interior-editor"){
    const card = stageSection("editor").querySelector(".card.editor") || editorCard();
    const th = jsonField(buf, "thinking"), bwo = jsonField(buf, "bwo"),
      rp = jsonField(buf, "response"), ju = jsonField(buf, "justification");
    if (th !== null) card.querySelector(".think").textContent = th;
    if (bwo !== null) card.querySelector(".surface").textContent = bwo;
    if (rp !== null) card.querySelector(".reply").textContent = rp;
    if (ju !== null) card.querySelector(".just").textContent = ju;
    return;
  }
  if (id.startsWith("final/armor")){
    armorRound(roundOfArmor(id)).cand.textContent = buf;
    return;
  }
  if (id.startsWith("final/fit-check")){
    const n = +(/fit-check-(\d+)/.exec(id) || [0, 1])[1];
    const r = armorRounds[n]; if (!r) return;
    const ex = jsonField(buf, "explanation");
    if (ex !== null) fitDetails(r).textContent = ex;
    return;
  }
  if (id.startsWith("final/redraft")){
    const n = +(/redraft-(\d+)/.exec(id) || [0, 1])[1];
    const r = armorRounds[n]; if (!r) return;
    if (!r.redraft){
      el("div", "note", r.box, "redraft:");
      r.redraft = el("div", "panel stream redraft", r.box);
    }
    r.redraft.textContent = buf;
  }
}

globalThis.personaReplayView = {
  paused: false,
  emit: receiveEvent,
  clear: () => { clearAll(); setBusy(false); },
  whenIdle,
  showTurn,
  addMessage: addMsg,
  setStatus,
  setName: name => {
    personaName = name.charAt(0).toUpperCase() + name.slice(1);
    $("#pname").textContent = personaName;
    $("#modelInfo").textContent = "Astra";
    document.title = personaName + " · Conversation replay";
  },
};

// ---- wiring ----
const es = new EventSource("/events");
es.onmessage = e => {
  const ev = JSON.parse(e.data);
  receiveEvent(ev);
};
fetch("/info").then(r => r.json()).then(i => {
  personaName = i.persona.charAt(0).toUpperCase() + i.persona.slice(1);
  $("#pname").textContent = personaName;
  $("#input").placeholder = "Message " + personaName;
  document.title = personaName + " · Conversation";
  $("#modelInfo").textContent = i.models
    ? [...new Set(Object.values(i.models))].map(model => model === "gpt-6-astra" ? "Astra" : model).join(" / ") : "";
  setBusy(i.busy || !playbackIdle());
});
function loadTraces(){
  fetch("/traces").then(r => r.json()).then(t => {
    const sel = $("#traceSel"), cur = sel.value;
    sel.innerHTML = "";
    t.traces.forEach(d => el("option", "", sel, d));
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  });
}
loadTraces();
$("#exportBtn").onclick = async () => {
  try {
    const response = await fetch("/export");
    if (!response.ok) { setStatus((await response.json()).error); return; }
    const data = await response.json();
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: "application/json"}));
    const link = document.createElement("a");
    link.href = url; link.download = data.id + ".json"; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus("Conversation exported.");
  } catch { setStatus("Could not export the conversation. Check the local server."); }
};
$("#newBtn").onclick = () => {
  fetch("/reset", {method:"POST", headers:{"Content-Type":"application/json"},
    body: "{}"}).then(r => { if (r.ok) clearAll(); });
};
$("#replayBtn").onclick = () => {
  fetch("/reset", {method:"POST", headers:{"Content-Type":"application/json"},
    body: "{}"}).then(r => {
      if (!r.ok) return;
      clearAll();
      fetch("/replay", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({dir: $("#traceSel").value})});
    });
};
function send(){
  const t = $("#input").value.trim();
  if (!t || busy) return;
  $("#input").value = "";
  fetch("/message", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({text: t})}).then(r => {
      if (!r.ok) r.json().then(j => setStatus(j.error || "rejected"));
    });
}
$("#send").onclick = send;
$("#input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
</script>
