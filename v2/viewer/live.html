<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>persona2 — live</title>
<style>
:root{
  --bg:#faf8f2; --card:#fff; --line:#e2ded4; --ink:#26221a; --muted:#8a8271;
  --accent:#7a5af5; --good:#2e7d32; --bad:#b3402a; --chip:#f0ece2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:400px 1fr;height:100vh;overflow:hidden}
h1{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:12px}

/* ---------- left: chat ---------- */
#chat{display:flex;flex-direction:column;border-right:1px solid var(--line);
  background:#f5f1e8;height:100vh}
#chat header{padding:14px 16px;border-bottom:1px solid var(--line)}
#situation{font-size:12px;color:var(--muted);margin-top:4px}
#bar{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line)}
#bar select{flex:1;min-width:0;font-size:12px;padding:4px;border:1px solid var(--line);
  border-radius:4px;background:#fff}
#bar button{font-size:12px;padding:4px 10px;border:1px solid var(--line);
  border-radius:4px;background:#fff;cursor:pointer;white-space:nowrap}
#transcript{flex:1;overflow-y:auto;padding:14px 16px;display:flex;
  flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;white-space:pre-wrap}
.msg.us{align-self:flex-end;background:#e7e0f8;border:1px solid #d4c8f0;
  border-bottom-right-radius:3px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);
  border-bottom-left-radius:3px}
.msg .who{font-size:10px;color:var(--muted);margin-bottom:2px;
  text-transform:uppercase;letter-spacing:.06em}
#composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
#composer textarea{flex:1;resize:none;height:60px;padding:8px;font:inherit;
  border:1px solid var(--line);border-radius:8px;background:#fff}
#composer button{padding:0 18px;border:none;border-radius:8px;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:600}
#composer button:disabled{background:#c5bcae;cursor:default}
#status{padding:4px 16px 10px;font-size:11px;color:var(--muted);min-height:18px}

/* ---------- right: pipeline ---------- */
#pipe{overflow-y:auto;height:100vh;padding:18px 26px 80px}
.stage{margin-bottom:28px;animation:fadeup .55s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
.stage>h2{font-size:13px;margin:0;letter-spacing:.05em;text-transform:uppercase}
.stage>.sub{margin:2px 0 12px;max-width:780px}
.turnhdr{font-size:12px;color:var(--muted);border-top:2px solid var(--line);
  padding-top:10px;margin:10px 0 18px}
.waiting{font-size:12px;color:var(--muted);font-style:italic}

/* machine bubbles */
#mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;overflow:hidden;animation:pop .35s ease;
  transition:padding .4s ease,background .4s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.bubble h3{margin:0;font-size:13px;display:flex;gap:6px;align-items:center}
.chip{font-size:10px;background:var(--chip);border-radius:8px;padding:1px 7px;
  color:var(--muted)}
.bubble .sens{font-size:11px;color:var(--muted);margin:3px 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stream{white-space:pre-wrap;font-size:12px;max-height:220px;overflow-y:auto}
.typing .stream:not(:empty)::after{content:"▋";animation:blink 1s steps(1) infinite;
  color:var(--accent)}
@keyframes blink{50%{opacity:0}}
details.compact{font-size:12px;margin:4px 0}
details.compact>summary{cursor:pointer;color:var(--muted);font-size:11px;
  user-select:none}
.bubble.shrunk .stream,.bubble.shrunk details,.bubble.shrunk .sens{display:none}
.bubble.shrunk{padding:6px 10px;background:#fbfaf6}
.bubble.shrunk h3{font-size:12px}
.bubble .conclusion{font-size:11px;color:var(--muted);display:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble.shrunk .conclusion{display:block}

/* selection list */
.sellist{display:flex;flex-direction:column;gap:3px}
.selrow{font-size:12px;color:var(--muted)}
.selrow b{color:var(--ink);font-weight:600}

/* groups: bordered boxes, arrow straight down into the synthesizer */
.grouprow{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.groupcol{flex:1;min-width:320px;display:flex;flex-direction:column}
.groupbox{border:2px solid #cfc6b4;border-radius:12px;padding:10px;
  display:flex;flex-direction:column;gap:8px;background:#fdfcf8}
.groupbox .glabel{font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}
.arrow{align-self:center;width:2px;height:26px;background:#cfc6b4;position:relative}
.arrow::after{content:"";position:absolute;bottom:-1px;left:-4px;
  border:5px solid transparent;border-top-color:#cfc6b4}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;animation:pop .35s ease}
.card h3{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center;
  flex-wrap:wrap}
.badge{font-size:10px;border-radius:8px;padding:1px 8px;background:#e7e0f8;
  color:#5a3fd6;text-transform:uppercase;letter-spacing:.05em}
.panel{border-left:3px solid var(--line);padding:4px 10px;margin:8px 0;
  font-size:12px;white-space:pre-wrap}
.panel.surface{border-left-color:#c99}
.panel.reply{border-left-color:#9c9}
.verdict{font-weight:700;font-size:12px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
#finalreply{font-size:16px;background:#eef7ee;border:1px solid #cfe6cf;
  border-radius:12px;padding:16px 20px;max-width:720px;white-space:pre-wrap;
  animation:pop .4s ease}
.err{background:#fbe9e5;border:1px solid #eac4bb;color:var(--bad);
  border-radius:8px;padding:10px 14px;margin:10px 0;font-size:12px}
.note{font-size:11px;color:var(--muted)}
.done-dim .stage:not(:last-child){opacity:.78}
</style>
</head>
<body>
<div id="chat">
  <header>
    <h1>persona2 <span id="pname" class="chip"></span></h1>
    <div id="situation"></div>
  </header>
  <div id="bar">
    <button id="newBtn">new conversation</button>
    <select id="traceSel"><option>loading…</option></select>
    <button id="replayBtn">replay</button>
  </div>
  <div id="transcript"></div>
  <div id="status"></div>
  <div id="composer">
    <textarea id="input" placeholder="Say something…"></textarea>
    <button id="send">send</button>
  </div>
</div>
<div id="pipe"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const pipe = $("#pipe");
let personaName = "persona";

/* Presentation names and descriptions — what each step does in general. */
const STAGES = {
  selection:["Selection",
    "The incoming moment is read — including what it implies but doesn't state — and the machines most responsive to it are woken. A few core processes always run."],
  machines:["Desiring machines",
    "Independent inner processes running in parallel. Each one reads the moment through a single narrow sensitivity and works out its own reaction to it."],
  synthesis:["Synthesis",
    "The machines' reactions are gathered into small groups, and each group is woven into one combined current of the persona's inner life."],
  editor:["Interior update",
    "The persona's inner state — a continuous written surface — is edited to absorb what just happened, and a draft reply is spoken from it."],
  armor:["Refinement & fit",
    "The draft is pared down to what a person would actually say. An independent reader, shown only the conversation, judges whether the reply fits; if not, it is redrafted."],
};
let buffers = {}, machineEls = {}, groupEls = [], stageEls = {}, busy = false;
let armorRounds = {}, shown = {}, doneQ = {};
const txt = id => (buffers[id] || "").slice(0, shown[id] || 0);

/* Typewriter drain: network deltas land in buffers; the screen advances at
   a steady rate, catching up gently when behind — no bursts, no snapping. */
setInterval(() => {
  let moved = false;
  for (const id in buffers){
    const full = buffers[id], s = shown[id] || 0;
    if (s < full.length){
      moved = true;
      const lag = full.length - s;
      shown[id] = s + Math.max(2, Math.min(70, Math.ceil(lag / 25)));
      route(id);
    } else if (doneQ[id]){
      const fn = doneQ[id]; delete doneQ[id]; fn();
    }
  }
  if (moved) followPipe();
}, 33);
function scheduleDone(id, fn){
  if ((shown[id] || 0) >= (buffers[id] || "").length) fn();
  else doneQ[id] = fn;
}

/* Follow the pipeline only while the user is near the bottom. */
let follow = true;
pipe.addEventListener("scroll", () => {
  follow = pipe.scrollHeight - pipe.scrollTop - pipe.clientHeight < 220;
});
function followPipe(){ if (follow) pipe.scrollTop = pipe.scrollHeight; }

function el(tag, cls, parent, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function setStatus(t){ $("#status").textContent = t; }
function setBusy(b){ busy = b; $("#send").disabled = b;
  $("#replayBtn").disabled = b; $("#newBtn").disabled = b; }
function addMsg(who, text){
  const mine = who === "you";
  const m = el("div", "msg " + (mine ? "us" : "them"), $("#transcript"));
  el("div", "who", m, mine ? "you" : personaName);
  el("div", "", m, text);
  $("#transcript").scrollTop = 1e9;
}
function clearAll(){
  $("#transcript").innerHTML = "";
  pipe.innerHTML = "";
  buffers = {}; machineEls = {}; groupEls = []; stageEls = {}; armorRounds = {};
  document.body.classList.remove("done-dim");
  setStatus("");
}
function stageSection(name){
  if (stageEls[name]) return stageEls[name];
  const s = el("section", "stage", pipe);
  const [title, sub] = STAGES[name] || [name, ""];
  el("h2", "", s, title);
  el("div", "sub", s, sub);
  stageEls[name] = s;
  followPipe();
  return s;
}
function jsonField(buf, key){
  const m = new RegExp('"' + key + '"\\s*:\\s*"').exec(buf);
  if (!m) return null;
  let i = m.index + m[0].length, out = "";
  while (i < buf.length){
    const c = buf[i];
    if (c === "\\"){
      const n = buf[i + 1];
      if (n === undefined) break;
      if (n === "n") out += "\n";
      else if (n === "t") out += "\t";
      else if (n === "u"){ const h = buf.slice(i + 2, i + 6);
        if (h.length === 4){ out += String.fromCharCode(parseInt(h, 16)); i += 4; } }
      else out += n;
      i += 2; continue;
    }
    if (c === '"') break;
    out += c; i++;
  }
  return out;
}
const PRODUCT_RE = /(?:^|\n)\s*#{0,3}\s*\**PRODUCT\**\s*:?\s*(?:\n|$)/;

function machinesStage(){
  const s = stageSection("machines");
  if (!s.querySelector("#mgrid")) el("div", "", s, "").id = "mgrid";
  return s;
}
function machineBubble(m){
  machinesStage();
  const b = el("div", "bubble typing", $("#mgrid"));
  b.dataset.name = m.name;
  const h = el("h3", "", b, m.name + " ");
  el("span", "chip", h, m.category);
  el("div", "sens", b, m.sensitivity || "");
  const d = el("details", "compact", b);
  el("summary", "", d, "internal analysis");
  d.open = true;
  el("div", "stream ana", d);
  el("div", "stream prod", b);
  el("div", "conclusion", b);
  b.onclick = () => {
    if (b.parentElement && b.parentElement.classList.contains("groupbox"))
      b.classList.toggle("shrunk");
  };
  machineEls[m.name] = b;
  return b;
}
function renderMachine(name){
  const b = machineEls[name]; if (!b) return;
  const buf = txt("machine/" + name);
  const m = PRODUCT_RE.exec(buf);
  const ana = b.querySelector(".ana"), prod = b.querySelector(".prod");
  if (m){
    ana.textContent = buf.slice(0, m.index);
    prod.textContent = buf.slice(m.index + m[0].length);
    b.querySelector("details").open = false;
  } else {
    ana.textContent = buf;
  }
  (m ? prod : ana).scrollTop = 1e9;
}

function resetTurn(inputText, replay){
  buffers = {}; machineEls = {}; groupEls = []; stageEls = {};
  armorRounds = {}; shown = {}; doneQ = {};
  pipe.innerHTML = "";
  follow = true;
  document.body.classList.remove("done-dim");
  addMsg("you", inputText);
  setBusy(true);
  setStatus(replay ? "replaying…" : "the persona is thinking…");
}

const handlers = {
  session_reset: () => { clearAll(); setBusy(false); loadTraces(); },
  turn_started: ev => resetTurn(ev.input, ev.replay),
  stage_started: ev => {
    if (STAGES[ev.stage]) stageSection(ev.stage);
    if (ev.stage === "selection"){
      const s = stageSection("selection");
      if (!s.querySelector(".waiting"))
        el("div", "waiting", s, "reading the moment…");
    }
  },
  selection_done: ev => {
    const s = stageSection("selection");
    const w = s.querySelector(".waiting"); if (w) w.remove();
    const list = el("div", "sellist", s);
    ev.fired.forEach(m => {
      const r = el("div", "selrow", list);
      el("b", "", r, m.name);
      el("span", "", r, " — " + (m.resonance || ""));
    });
    machinesStage();
    ev.fired.forEach(machineBubble);
  },
  call_started: ev => {
    if (ev.id.startsWith("final/armor"))
      armorRound(roundOfArmor(ev.id)).cand.classList.add("typing");
  },
  call_delta: ev => {
    buffers[ev.id] = (buffers[ev.id] || "") + ev.text;
  },
  call_done: ev => {
    scheduleDone(ev.id, () => {
      if (ev.id.startsWith("machine/")){
        const name = ev.id.slice(8), b = machineEls[name];
        if (b){
          b.classList.remove("typing");
          const buf = buffers[ev.id] || "", m = PRODUCT_RE.exec(buf);
          const prod = m ? buf.slice(m.index + m[0].length) : buf;
          b.querySelector(".conclusion").textContent =
            prod.split("\n").find(l => l.trim()) || "";
        }
      }
      if (ev.id.startsWith("final/armor"))
        armorRound(roundOfArmor(ev.id)).cand.classList.remove("typing");
    });
  },
  groups_assigned: ev => {
    // FLIP: capture where every bubble is, move them into their group
    // boxes, then animate from the old position to the new one.
    const before = new Map(
      Object.entries(machineEls).map(([n, b]) => [n, b.getBoundingClientRect()]));
    // Regroup INSIDE the machines stage — its header stays; the synthesis
    // stage gets one aligned column per group, arrow at the top.
    const ms = machinesStage();
    const grid = ms.querySelector("#mgrid"); if (grid) grid.remove();
    const grow = el("div", "grouprow", ms);
    const s = stageSection("synthesis");
    const srow = el("div", "grouprow", s);
    ev.groups.forEach((members, i) => {
      const gcol = el("div", "groupcol", grow);
      const box = el("div", "groupbox", gcol);
      el("div", "glabel", box, "group " + (i + 1));
      members.forEach(n => {
        const b = machineEls[n];
        if (b){ b.classList.add("shrunk"); box.appendChild(b); }
      });
      const scol = el("div", "groupcol", srow);
      el("div", "arrow", scol);
      const c = el("div", "card synth", scol);
      const h = el("h3", "", c, "synthesizer — group " + (i + 1) + " ");
      el("span", "badge mode", h, "…");
      const d = el("details", "compact", c);
      el("summary", "", d, "internal reasoning"); d.open = true;
      el("div", "stream think", d);
      el("div", "stream result", c);
      groupEls.push({members, card: c});
    });
    requestAnimationFrame(() => {
      for (const [n, b] of Object.entries(machineEls)){
        const r0 = before.get(n); if (!r0) continue;
        const r1 = b.getBoundingClientRect();
        b.style.transition = "none";
        b.style.transform =
          `translate(${r0.left - r1.left}px,${r0.top - r1.top}px)`;
        requestAnimationFrame(() => {
          b.style.transition = "transform .65s ease";
          b.style.transform = "";
        });
      }
      followPipe();
    });
  },
  synthesis_done: ev => {
    const g = groupEls[ev.group - 1]; if (!g) return;
    const id = "synthesis/" + ev.members.join(" + ");
    scheduleDone(id, () => {
      g.card.querySelector(".mode").textContent = ev.mode;
      g.card.querySelector(".think").textContent = ev.thinking;
      g.card.querySelector(".result").textContent = ev.result;
      g.card.querySelector("details").open = false;
    });
  },
  editor_done: ev => {
    const card = stageSection("editor").querySelector(".card.editor") || editorCard();
    scheduleDone("final/interior-editor", () => {
      card.querySelector("details.th").open = false;
      card.querySelector(".surface").textContent = ev.bwo;
      card.querySelector(".reply").textContent = ev.response;
      card.querySelector(".just").textContent = ev.justification || "(none)";
      const ed = card.querySelector(".editlist");
      ed.innerHTML = "";
      (ev.edits || []).forEach(e =>
        el("div", "note", ed, "• " + (e.change || "") + "  [" + (e.driven_by || []).join(", ") + "]"));
    });
  },
  fit_round: ev => {
    const r = armorRound(ev.round);
    if (r.live) r.live.remove(), r.live = null;
    const v = el("div", "", r.box);
    el("span", "verdict " + (ev.fits ? "ok" : "no"), v,
      ev.fits ? "✓ fits the conversation" : "✗ does not fit");
    const d = el("details", "compact", v);
    el("summary", "", d, "reader's explanation");
    el("div", "stream", d, ev.explanation);
  },
  turn_done: ev => {
    const s = el("section", "stage", pipe);
    el("h2", "", s, "The reply");
    el("div", "sub", s, "What the persona says.");
    el("div", "", s, "").id = "finalreply";
    $("#finalreply").textContent = ev.response;
    addMsg("persona", ev.response);
    document.body.classList.add("done-dim");
    setBusy(false); setStatus("");
    followPipe();
  },
  turn_error: ev => {
    el("div", "err", pipe, "turn failed: " + ev.error);
    setBusy(false); setStatus("error — see right pane");
  },
  trace_saved: () => loadTraces(),
};

function editorCard(){
  const s = stageSection("editor");
  const card = el("div", "card editor", s);
  el("h3", "", card, "interior editor");
  const det = el("details", "compact th", card);
  el("summary", "", det, "internal reasoning");
  det.open = true;
  el("div", "stream think", det);
  el("div", "note", card, "inner state (BwO), after this moment:");
  el("div", "panel surface", card);
  el("div", "note", card, "draft reply:");
  el("div", "panel reply", card);
  const jd = el("details", "compact", card);
  el("summary", "", jd, "why this reply — grounded in the inner state");
  el("div", "stream just", jd);
  const edd = el("details", "compact", card);
  el("summary", "", edd, "what changed on the inner state");
  el("div", "editlist", edd);
  return card;
}
function roundOfArmor(id){
  const m = /armor-?(\d*)$/.exec(id); return m && m[1] ? +m[1] : 1;
}
function armorRound(n){
  if (armorRounds[n]) return armorRounds[n];
  const s = stageSection("armor");
  const box = el("div", "card", s);
  el("h3", "", box, "attempt " + n);
  const cand = el("div", "panel reply stream", box);
  armorRounds[n] = {box, cand, live: null};
  return armorRounds[n];
}
function route(id){
  const buf = txt(id);
  if (id.startsWith("machine/")) return renderMachine(id.slice(8));
  if (id.startsWith("synthesis/")){
    const label = id.slice(10);
    const g = groupEls.find(x => x.members.join(" + ") === label);
    if (!g) return;
    const th = jsonField(buf, "thinking"), rs = jsonField(buf, "result");
    if (th !== null) g.card.querySelector(".think").textContent = th;
    if (rs !== null) g.card.querySelector(".result").textContent = rs;
    return;
  }
  if (id === "final/interior-editor"){
    const card = stageSection("editor").querySelector(".card.editor") || editorCard();
    const th = jsonField(buf, "thinking"), bwo = jsonField(buf, "bwo"),
      rp = jsonField(buf, "response"), ju = jsonField(buf, "justification");
    if (th !== null) card.querySelector(".think").textContent = th;
    if (bwo !== null) card.querySelector(".surface").textContent = bwo;
    if (rp !== null) card.querySelector(".reply").textContent = rp;
    if (ju !== null) card.querySelector(".just").textContent = ju;
    return;
  }
  if (id.startsWith("final/armor")){
    armorRound(roundOfArmor(id)).cand.textContent = buf;
    return;
  }
  if (id.startsWith("final/fit-check")){
    const n = +(/fit-check-(\d+)/.exec(id) || [0, 1])[1];
    const r = armorRounds[n]; if (!r) return;
    if (!r.live) r.live = el("div", "note stream", r.box);
    const ex = jsonField(buf, "explanation");
    if (ex !== null) r.live.textContent = "reader: " + ex;
    return;
  }
  if (id.startsWith("final/redraft")){
    const n = +(/redraft-(\d+)/.exec(id) || [0, 1])[1];
    const r = armorRounds[n]; if (!r) return;
    if (!r.redraft){
      el("div", "note", r.box, "redraft:");
      r.redraft = el("div", "panel stream", r.box);
    }
    r.redraft.textContent = buf;
  }
}

// ---- wiring ----
const es = new EventSource("/events");
es.onmessage = e => {
  const ev = JSON.parse(e.data);
  (handlers[ev.type] || (() => {}))(ev);
};
fetch("/info").then(r => r.json()).then(i => {
  personaName = i.persona;
  $("#pname").textContent = i.persona;
  $("#situation").textContent = i.situation;
  setBusy(i.busy);
});
function loadTraces(){
  fetch("/traces").then(r => r.json()).then(t => {
    const sel = $("#traceSel"), cur = sel.value;
    sel.innerHTML = "";
    t.traces.forEach(d => el("option", "", sel, d));
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  });
}
loadTraces();
$("#newBtn").onclick = () => {
  fetch("/reset", {method:"POST", headers:{"Content-Type":"application/json"},
    body: "{}"}).then(r => { if (r.ok) clearAll(); });
};
$("#replayBtn").onclick = () => {
  fetch("/reset", {method:"POST", headers:{"Content-Type":"application/json"},
    body: "{}"}).then(r => {
      if (!r.ok) return;
      clearAll();
      fetch("/replay", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({dir: $("#traceSel").value})});
    });
};
function send(){
  const t = $("#input").value.trim();
  if (!t || busy) return;
  $("#input").value = "";
  fetch("/message", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({text: t})}).then(r => {
      if (!r.ok) r.json().then(j => setStatus(j.error || "rejected"));
    });
}
$("#send").onclick = send;
$("#input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
</script>
</body>
</html>
